<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa Culturama</title>
</head>

<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <!--DADOS PESSOAIS-->
                <legend>Informações Pessoais</legend>

                <label for="userName">Nome</label>
                <input id="userName" type="text" name="userName" placeholder="Digite seu nome" required>
                <br>

                <label for="userAge">Idade</label>
                <input id="userAge" type="number" name="userAge" min="12" max="100" required>
                <br>


                <label for="birthDate">Data de Nascimento</label>
                <input id="birthDate" type="date" name="birthDate">
                <br>


                <label for="userEmail">E-mail</label>
                <input id="userEmail" type="email" name="userEmail" placeholder="Digite seu e-mail" required>
                <br>

                <label for="userPhone">Telefone</label>
                <input id="userPhone" type="tel" name="userPhone" pattern="[0-9]{11}" placeholder="DDD + número sem espaços ou hífen">
                <br>

                <label for="userPhoto">Upload de Foto</label>
                <input id="userPhoto" type="file" accept="image/*" name="userPhoto">
                <br>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <input type="radio" name="userGender" value="Masculino" id="male">
                <label for="male">Masculino</label>
                <input type="radio" name="userGender" value="Feminino" id="female">
                <label for="female">Feminino</label>
                <input type="radio" name="userGender" value="non-binary" id="non-binary">
                <label for="non-binary">Não Binário</label>
                <input type="radio" name="userGender" value="notInformed" id="notInformed">
                <label for="notInformed">Prefiro não informar</label>
                <br>

                <label for="maritalStatus">Estado Civil:</label>
                <select id="maritalStatus" name="maritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="viuvo">Viúvo</option>
                </select>

                <label for="userState">Estado:</label>
                <select id="userState" name="userState" required>
                    <option value="notInformed">Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espirito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                   
                </select>

                <label for="userCity">Cidade:</label>
                <input id="userCity" type="text" name="userCity" autocomplete="address-level2" placeholder="Digite sua cidade">



            </fieldset>

            <fieldset>  
                <legend>Hábitos</legend>
                <p>Redes Sociais:</p>
                <input type="checkbox" name="social" value="instagram" id="instagram">
                <br>
                <label for="instagram">Instagram</label>
                <input type="checkbox" name="social" value="facebook" id="facebook">
                <br>
                <label for="facebook">Facebook</label>
                <input type="checkbox" name="social" value="x" id="x">
                <br>
                <label for="x">X</label>
                <br>
                <label for="musicStyle">Estilo Musical:</label>
                <input list="styleTypes" id="musicStyle" type="text" name="musicStyle" placeholder="Digite seu estilo musical favorito">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Hip Hop">
                    <option value="Eletrônica">
                    <option value="Sertanejo">
                </datalist>
                <br>
                <label for="favoriteColor">Cor Favorita:</label>
                <input id="favoriteColor" type="color" name="userFavoriteColor">

            </fieldset>
            <fieldset>
                <legend>Opinião</legend>
                <p>O que você acha da qualidade do nosso serviço?</p>
                <input type="radio" name="serviceQuality" value="Excelente" id="excellent">
                <label for="excellent">Excelente</label> <br>
                <input type="radio" name="serviceQuality" value="Bom" id="good">
                <label for="good">Bom</label> <br>
                <input type="radio" name="serviceQuality" value="Regular" id="regular">
                <label for="regular">Regular</label> <br>  
                <input type="radio" name="serviceQuality" value="Ruim" id="bad">
                <label for="bad">Ruim</label> <br>

                <label for="userComments">Escreva sua opinião:</label>
                <textarea id="userComments" name="userComments" rows="4" cols="50" placeholder="Digite aqui sua opinião..."></textarea>

            </fieldset>

            <button type="submit">Enviar</button>

        </form>
    </section>

</body>

</html>
